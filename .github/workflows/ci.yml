# Verificacion obligatoria en cada push/PR: el guardian del monolito, el
# tipado, la suite completa y el build. Sin verde aqui no se integra a main.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Golden de admin-usuarios.test.mjs consulta un commit anterior.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias (lockfile congelado)
        run: pnpm install --frozen-lockfile

      - name: check-app (guardian del monolito + tema claro)
        run: node scripts/check-app.mjs

      - name: Tipado
        run: npx tsc --noEmit

      - name: Suite node (unitarias + caracterizacion)
        run: node --test scripts/tests/*.test.mjs

      - name: Suite Python (reconcile leads, stdlib)
        run: python3 -m unittest scripts/tests/test_reconcile_leads.py

      - name: Build
        run: pnpm run build

      # El script usa --pull=never (sin red dentro del contenedor): la imagen
      # fijada se descarga antes en un paso propio.
      # ECR publico limita las descargas anonimas (toomanyrequests): reintento
      # con espera y, si sigue fallando, la misma etiqueta desde Docker Hub.
      - name: Imagen PostgreSQL de pruebas
        run: |
          image=public.ecr.aws/supabase/postgres:17.6.1.166
          for attempt in 1 2 3; do
            docker pull $image && exit 0
            sleep $((attempt * 15))
          done
          docker pull supabase/postgres:17.6.1.166
          docker tag supabase/postgres:17.6.1.166 $image

      - name: Pruebas PostgreSQL de campañas (contenedor desechable)
        run: bash scripts/test-campaign-postgres.sh
