<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Página no encontrada — Gestión de Leads</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 1.5rem; background: #020617; color: #e2e8f0;
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .card {
      width: 100%; max-width: 30rem; text-align: center;
      background: #1e293b; border: 1px solid #334155; border-radius: 1rem; padding: 2.5rem 1.75rem;
      box-shadow: 0 20px 40px -20px rgba(0, 0, 0, .6);
    }
    .codigo {
      font-size: 3.5rem; font-weight: 800; line-height: 1; color: #818cf8;
      font-variant-numeric: tabular-nums; margin: 0 0 .5rem;
    }
    h1 { font-size: 1.25rem; margin: 0 0 .75rem; color: #f8fafc; }
    p { font-size: .875rem; line-height: 1.5; margin: 0 0 1.5rem; color: #cbd5e1; }
    a {
      display: inline-flex; align-items: center; gap: .5rem; padding: .625rem 1.25rem;
      background: #4f46e5; color: #ffffff; font-size: .875rem; font-weight: 600;
      text-decoration: none; border-radius: .5rem;
    }
    a:hover { background: #6366f1; }
    a:focus-visible { outline: 2px solid #a5b4fc; outline-offset: 2px; }
    .marca { font-size: .75rem; color: #94a3b8; margin-top: 1.5rem; }
  </style>
</head>
<body>
  <main class="card">
    <p class="codigo">404</p>
    <h1>Página no encontrada</h1>
    <p>La dirección que buscas no existe o fue movida. Vuelve al panel para continuar.</p>
    <a href="/">Ir al panel</a>
    <p class="marca">Gestión de Leads — Sociedad Actoral Hispanoamericana</p>
  </main>
</body>
</html>
